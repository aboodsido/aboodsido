<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Most used languages">
  
  <defs>
    <linearGradient id="lg-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="lg-dark-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD"/><stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace; }
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <clipPath id="lg-dark-bar"><rect width="424" height="10" rx="5"/></clipPath>
