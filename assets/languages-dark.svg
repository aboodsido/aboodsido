  <text x="452" y="44" text-anchor="end" font-size="12" fill="#8b9bb4">public repos, by code size</text>
  <g transform="translate(28 66)" clip-path="url(#lg-dark-bar)"><rect x="0" y="0" width="372.2170777856685" height="10" fill="#00B4AB"/><rect x="372.2170777856685" y="0" width="43.06123330734353" height="10" fill="#e34c26"/><rect x="415.278311093012" y="0" width="4.417697568049423" height="10" fill="#f1e05a"/><rect x="419.69600866106146" y="0" width="4.303991338938523" height="10" fill="#7355dd"/></g>
