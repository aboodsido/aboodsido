<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Abdullah Abo-Sido, Flutter Developer">
  
  <defs>
    <linearGradient id="hd-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="hd-dark-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD"/><stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
  </defs>
  
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace; }
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    
    .blob { animation: drift 14s ease-in-out infinite alternate; transform-origin: center; }
    .blob2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-40px, 20px) scale(1.15); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <clipPath id="hd-dark-clip"><rect width="1000" height="300" rx="20"/></clipPath>
  <g clip-path="url(#hd-dark-clip)">
    <rect width="1000" height="300" fill="url(#hd-dark-bg)"/>
    <circle class="blob" cx="860" cy="40" r="170" fill="#13B9FD" opacity="0.16"/>
    <circle class="blob blob2" cx="980" cy="260" r="150" fill="#5b6cff" opacity="0.18"/>
    <circle class="blob" cx="80" cy="320" r="120" fill="#02569B" opacity="0.22"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="20" fill="none" stroke="#22304f"/>

  <g class="fade">
    <text x="60" y="78" font-size="16" fill="#8b9bb4" font-weight="600" letter-spacing="3">HELLO, WORLD — I'M</text>
    <text x="58" y="138" font-size="54" font-weight="800" fill="#e6edf3" letter-spacing="-1">Abdullah <tspan fill="url(#hd-dark-accent)">Abo-Sido</tspan></text>
  </g>
  <g class="fade" style="animation-delay:.15s">
    <text x="60" y="182" font-size="21" fill="#8b9bb4">Flutter developer crafting fast, pixel-perfect mobile apps.</text>
  </g>
  <g class="fade" style="animation-delay:.3s"><g transform="translate(60 214)"><rect width="166.79999999999998" height="32" rx="16" fill="#16213d" stroke="#22304f"/>
      <text x="83.39999999999999" y="21" text-anchor="middle" font-size="13.5" fill="#9cc9ff" font-weight="600">📍 Gaza, Palestine</text></g><g transform="translate(236.79999999999998 214)"><rect width="113.6" height="32" rx="16" fill="#16213d" stroke="#22304f"/>
      <text x="56.8" y="21" text-anchor="middle" font-size="13.5" fill="#9cc9ff" font-weight="600">💼 Optimiza</text></g><g transform="translate(360.4 214)"><rect width="197.2" height="32" rx="16" fill="#16213d" stroke="#22304f"/>
      <text x="98.6" y="21" text-anchor="middle" font-size="13.5" fill="#9cc9ff" font-weight="600">📱 3+ years of Flutter</text></g></g>

  <g class="fade" style="animation-delay:.45s" transform="translate(690 70)">
    <rect width="260" height="170" rx="14" fill="#0a0f1e" stroke="#22304f" opacity="0.92"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="37" cy="20" r="5" fill="#febc2e"/><circle cx="54" cy="20" r="5" fill="#28c840"/>
    <text class="mono" x="236" y="24" text-anchor="end" font-size="11" fill="#8b9bb4">main.dart</text>
    <g transform="translate(20 58)"><text class="mono" x="0" y="0" font-size="13" xml:space="preserve"><tspan fill="#5b6cff">final </tspan><tspan fill="#13B9FD">dev</tspan><tspan fill="#8b9bb4"> = </tspan><tspan fill="#13B9FD">Developer</tspan><tspan fill="#8b9bb4">(</tspan></text><text class="mono" x="0" y="22" font-size="13" xml:space="preserve"><tspan fill="#8b9bb4">  name: </tspan><tspan fill="#7ee787">'Abdullah'</tspan><tspan fill="#8b9bb4">,</tspan></text><text class="mono" x="0" y="44" font-size="13" xml:space="preserve"><tspan fill="#8b9bb4">  loves: </tspan><tspan fill="#7ee787">'Flutter'</tspan><tspan fill="#8b9bb4">,</tspan></text><text class="mono" x="0" y="66" font-size="13" xml:space="preserve"><tspan fill="#8b9bb4">  ships: </tspan><tspan fill="#5b6cff">true</tspan><tspan fill="#8b9bb4">,</tspan></text><text class="mono" x="0" y="88" font-size="13" xml:space="preserve"><tspan fill="#8b9bb4">);</tspan></text>
      <rect class="cursor" x="30" y="77" width="8" height="14" fill="#13B9FD"/>
    </g>
  </g>
</svg>